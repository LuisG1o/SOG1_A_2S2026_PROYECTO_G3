version: '3.1'
services:
  web:
    image: odoo:16.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      - odoo-web-data:/var/lib/odoo
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo_password
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
  metabase:
    image: metabase/metabase:v0.50.36
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=db
      - MB_DB_PORT=5432
      - MB_DB_DBNAME=metabase
      - MB_DB_USER=odoo
      - MB_DB_PASS=odoo_password
      - JAVA_TIMEZONE=America/Guatemala

volumes:
  odoo-web-data:
  odoo-db-data: